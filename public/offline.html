<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Offline</title>
    <!-- Shown by public/sw.js when a page cannot be loaded offline: self-contained, no external files.
         Caligrafy's look (public/css/look.css): white canvas, the mark in the top bar, one message, a black action. -->
    <style>
        html, body { margin: 0; height: 100%; }
        body { display: flex; flex-direction: column; min-height: 100%; background: #ffffff; color: #393c41;
               font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
               font-size: 15px; -webkit-font-smoothing: antialiased; }
        nav { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 24px; color: #171a20; font-size: 17px; }
        nav svg { width: 28px; height: 28px; display: block; }
        nav b { font-weight: 500; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
               padding: 0 24px 56px; text-align: center; }
        h1 { margin: 0 0 12px; color: #171a20; font-size: 40px; line-height: 1.2; font-weight: 500; }
        p { margin: 0 0 32px; max-width: 420px; font-size: 17px; line-height: 1.45; color: #5c5e62; }
        button { min-height: 44px; min-width: 200px; padding: 0 24px; border: 0; border-radius: 4px; background: #000000;
                 color: #ffffff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
                 transition: background-color .33s; }
        button:hover { background: #333333; }
        button:focus-visible { outline: 2px solid #171a20; outline-offset: 2px; }
        @media (max-width: 575px) { h1 { font-size: 30px; } button { width: 100%; } }
    </style>
</head>
<body>
    <nav aria-label="Caligrafy">
        <svg viewBox="0 0 203 203" aria-hidden="true"><rect width="203" height="203" fill="#000"/><g fill="#fff"><rect x="50" y="39" width="63" height="17"/><rect x="50" y="39" width="16" height="119"/><rect x="50" y="141" width="63" height="17"/><rect x="81" y="88" width="56" height="18"/><rect x="137" y="39" width="16" height="119"/></g></svg>
        <span><b>Cali</b>grafy</span>
    </nav>
    <main>
        <h1>You are offline</h1>
        <p>This page needs a connection. Check your network, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
