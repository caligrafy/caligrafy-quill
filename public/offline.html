<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Offline</title>
    <!-- Shown by public/sw.js when a page cannot be loaded offline: self-contained, no external files -->
    <style>
        html, body { margin: 0; height: 100%; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px;
               background: #ffffff; color: #333333; text-align: center;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
        h1 { margin: 0 0 30px; color: #000000; font-size: 36px; font-weight: 300; }
        h1 span { font-weight: 600; }
        h2 { margin: 0 0 10px; color: #000000; font-size: 18px; font-weight: 600; }
        p { margin: 0 0 30px; max-width: 400px; line-height: 1.5; }
        button { padding: 6px 20px; border: 1px solid #000000; border-radius: 4px; background: #000000; color: #ffffff;
                 font: inherit; line-height: 1.42857143; cursor: pointer; }
        button:hover, button:focus { background: #333333; }
        button:focus-visible { outline: 2px solid #000000; outline-offset: 2px; }
    </style>
</head>
<body>
    <h1><span>Cali</span>grafy</h1>
    <h2>You are offline</h2>
    <p>This page needs a connection. Check your network, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
