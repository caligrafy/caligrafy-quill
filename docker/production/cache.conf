# Response cache of the production image (2.26.0): answers that Caligrafy marks public (HttpCache: a capability with
# cache, a page with 'cache') are kept in shared memory and served to the next visitors before PHP runs. Nothing else
# is kept: PHP answers carry no Last-Modified, so without Cache-Control: public they are never stored, and HttpCache
# never marks an answer that sets a cookie, goes to a signed-in person or a token, or is not a 200.
# CACHE=off in .env (or the environment) turns it off (docker/production/start.sh).
<IfModule mod_cache_socache.c>
    CacheEnable socache /
    CacheSocache shmcb:/tmp/caligrafy-http-cache(33554432)
    CacheSocacheMaxSize 262144
    CacheQuickHandler on
    CacheLock on
    CacheIgnoreHeaders Set-Cookie
    CacheHeader on
    CacheDefaultExpire 0
    CacheIgnoreNoLastMod Off
    CacheStoreNoStore Off
    CacheStorePrivate Off
</IfModule>
