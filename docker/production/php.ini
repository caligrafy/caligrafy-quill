; Production PHP settings of a Caligrafy Quill image (the Dockerfile copies them over php.ini-production), 2.26.0.
; The code never changes inside a running container: a new version is a new image.

; OPcache: compiled code stays in memory, and PHP no longer checks every file for changes on every request.
; The framework clears what it rewrites itself (the class map, compiled views) with opcache_invalidate().
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Paths resolved once per process instead of on every include
realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
